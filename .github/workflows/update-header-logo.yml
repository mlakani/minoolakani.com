name: Update header logo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace header logo with animated GIF
        run: |
          grep -rl 'brand-logo-512\.webp" alt="Minoo Lakani Production logo"' --include='*.html' . | while read -r f; do
            sed -E -i 's|<img src="(\.\./)?brand-logo-512\.webp" alt="Minoo Lakani Production logo"( width="58" height="58" decoding="async")?><span>|<img src="\1images/music-live-logo-header.gif" alt="Minoo Lakani Production logo"\2><span>|g' "$f"
          done
          git diff --stat
      - name: Commit and push
        run: |
          git config user.name "mlakani"
          git config user.email "mlakani@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use animated live MLP logo in header"
          git push
