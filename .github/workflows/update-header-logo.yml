name: Update header logo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix remaining old-logo headers
        run: |
          grep -rl 'brand-logo-512[.]webp' --include='*.html' . | while read -r f; do
            sed -i '/brand-logo-512[.]webp"[^>]*><span>/{s|src="[.][.]/brand-logo-512[.]webp"|src="../images/music-live-logo-header.gif"|;s|src="brand-logo-512[.]webp"|src="images/music-live-logo-header.gif"|}' "$f"
          done
          git diff --stat
          echo "=== old-logo header refs remaining (expect none) ==="
          grep -rn 'brand-logo-512[.]webp"[^>]*><span>' --include='*.html' . || echo "none found"
      - name: Commit and push
        run: |
          git config user.name "mlakani"
          git config user.email "mlakani@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use animated live MLP logo in header"
          git push
